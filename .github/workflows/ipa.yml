name: Build native iOS IPA
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Build the current incomplete version for testing on a phone'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce complete original parity before final IPA packaging
        if: ${{ !inputs.preview }}
        run: python3 scripts/check-parity.py
      - name: Select Xcode with the iOS 26 SDK
        run: |
          python3 - <<'PYTHON'
          import glob, os, re
          paths = glob.glob("/Applications/Xcode_26*.app")
          if not paths:
              raise SystemExit("Xcode 26 is required for Foundation Models")
          path = max(paths, key=lambda item: tuple(map(int, re.findall(r"\d+", item))))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"DEVELOPER_DIR={path}/Contents/Developer", file=env)
          PYTHON
      - run: brew install xcodegen
      - run: swift test
      - run: xcodegen generate
      - name: Build device application
        run: |
          set -o pipefail
          xcodebuild -project AnimationIOS.xcodeproj -scheme AnimationIOS -configuration Release -sdk iphoneos -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          mkdir -p out/Payload
          cp -R build/device/Build/Products/Release-iphoneos/AnimationIOS.app out/Payload/
          cd out && zip -qry AnimationIOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AnimationIOS-IPA
          path: out/*.ipa
      - name: Simulator screenshot
        run: |
          set -o pipefail
          xcodebuild -project AnimationIOS.xcodeproj -scheme AnimationIOS -configuration Debug -sdk iphonesimulator -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > simulator.log 2>&1
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for g in d["devices"].values() for x in g if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$PWD/build/simulator/Build/Products/Debug-iphonesimulator/AnimationIOS.app"
          plutil -p "$APP/Info.plist" | tee out/simulator-info.txt
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" out/simulator-app.zip
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" app.reconstruction.animation --ui-capture
          sleep 5
          xcrun simctl io "$DEVICE" screenshot out/editor.png
          xcodebuild -project AnimationIOS.xcodeproj -scheme AnimationIOS -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/uitests -resultBundlePath out/EditorTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test > uitests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnimationIOS-build-evidence
          path: |
            build.log
            simulator.log
            uitests.log
            out/EditorTests.xcresult
            out/*.png
            out/simulator-info.txt
            out/simulator-app.zip
