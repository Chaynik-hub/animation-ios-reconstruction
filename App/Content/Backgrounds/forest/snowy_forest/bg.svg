<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
    <!-- Overcast winter sky -->
    <rect x="0" y="0" width="640" height="240" fill="#B8CCE0"/>
    <rect x="0" y="200" width="640" height="120" fill="#C8D8E8"/>
    <rect x="0" y="290" width="640" height="70" fill="#D4E0EC"/>

    <!-- Pale sun -->
    <circle cx="520" cy="68" r="30" fill="#F0E8C8" opacity="0.75"/>

    <!-- Clouds -->
    <ellipse cx="110" cy="72" rx="48" ry="16" fill="#E8EEF4" opacity="0.95"/>
    <ellipse cx="142" cy="72" rx="32" ry="12" fill="#E8EEF4" opacity="0.95"/>
    <ellipse cx="300" cy="48" rx="40" ry="14" fill="#EEF2F8" opacity="0.92"/>
    <ellipse cx="328" cy="48" rx="26" ry="11" fill="#EEF2F8" opacity="0.92"/>
    <ellipse cx="420" cy="95" rx="34" ry="12" fill="#E8EEF4" opacity="0.9"/>
    <ellipse cx="448" cy="95" rx="22" ry="10" fill="#E8EEF4" opacity="0.9"/>

    <!-- Distant tree line -->
    <polygon points="0,330 40,300 80,318 120,292 160,310 200,285 240,305 280,278 320,298 360,272 400,290 440,268 480,288 520,265 560,282 600,270 640,295 640,360 0,360" fill="#2A5040"/>
    <polygon points="0,345 50,322 100,340 150,318 200,335 250,312 300,328 350,308 400,325 450,302 500,318 550,298 600,312 640,325 640,360 0,360" fill="#234838"/>
    <!-- Snow on distant treeline -->
    <polygon points="0,330 40,300 80,318 120,292 160,310 200,285 240,305 280,278 320,298 360,272 400,290 440,268 480,288 520,265 560,282 600,270 640,295 640,318 0,318" fill="#E8EEF4" opacity="0.55"/>

    <!-- Mid-layer pines -->
    <polygon points="70,360 95,290 120,360" fill="#1E4A32"/>
    <polygon points="70,360 95,310 120,360" fill="#EEF4FA"/>
    <polygon points="130,360 158,275 186,360" fill="#224E36"/>
    <polygon points="130,360 158,295 186,360" fill="#EEF4FA"/>
    <polygon points="195,360 220,300 245,360" fill="#1E4A32"/>
    <polygon points="195,360 220,318 245,360" fill="#EEF4FA"/>
    <polygon points="255,360 285,265 315,360" fill="#224E36"/>
    <polygon points="255,360 285,288 315,360" fill="#EEF4FA"/>
    <polygon points="325,360 350,295 375,360" fill="#1E4A32"/>
    <polygon points="325,360 350,312 375,360" fill="#EEF4FA"/>
    <polygon points="385,360 412,270 439,360" fill="#224E36"/>
    <polygon points="385,360 412,292 439,360" fill="#EEF4FA"/>
    <polygon points="445,360 470,305 495,360" fill="#1E4A32"/>
    <polygon points="445,360 470,322 495,360" fill="#EEF4FA"/>
    <polygon points="505,360 535,280 565,360" fill="#224E36"/>
    <polygon points="505,360 535,302 565,360" fill="#EEF4FA"/>
    <polygon points="575,360 600,298 625,360" fill="#1E4A32"/>
    <polygon points="575,360 600,315 625,360" fill="#EEF4FA"/>

    <!-- Snow ground -->
    <rect x="0" y="360" width="640" height="120" fill="#EEF2F8"/>
    <rect x="0" y="360" width="640" height="14" fill="#F8FAFC"/>

    <!-- Foreground left pine -->
    <rect x="18" y="300" width="16" height="180" fill="#1A3828"/>
    <polygon points="0,480 26,250 52,480" fill="#1E4030"/>
    <polygon points="0,480 26,290 52,480" fill="#F0F4FA"/>
    <polygon points="8,480 34,210 60,480" fill="#183828"/>
    <polygon points="8,480 34,255 60,480" fill="#E8EEF6"/>

    <!-- Foreground right pine -->
    <rect x="606" y="295" width="16" height="185" fill="#1A3828"/>
    <polygon points="588,480 614,245 640,480" fill="#1E4030"/>
    <polygon points="588,480 614,285 640,480" fill="#F0F4FA"/>
    <polygon points="580,480 606,205 632,480" fill="#183828"/>
    <polygon points="580,480 606,250 632,480" fill="#E8EEF6"/>

    <!-- Snow mounds (edges only) -->
    <ellipse cx="95" cy="432" rx="38" ry="16" fill="#F4F8FC"/>
    <ellipse cx="545" cy="436" rx="42" ry="18" fill="#F4F8FC"/>
    <ellipse cx="140" cy="456" rx="28" ry="11" fill="#EEF2F8"/>
    <ellipse cx="500" cy="458" rx="32" ry="12" fill="#EEF2F8"/>

    <!-- Falling snow -->
    <circle cx="85" cy="140" r="1.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="165" cy="180" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="240" cy="120" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="355" cy="155" r="1.1" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="470" cy="130" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="580" cy="165" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="130" cy="250" r="1.0" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="510" cy="240" r="1.1" fill="#FFFFFF" opacity="0.75"/>
</svg>
