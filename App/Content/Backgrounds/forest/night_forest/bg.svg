    <rect x="0" y="160" width="640" height="100" fill="#0A1020"/>
    <rect x="0" y="240" width="640" height="80" fill="#0F1828"/>
    <rect x="0" y="300" width="640" height="60" fill="#121F2E"/>

    <!-- Moon -->
    <circle cx="500" cy="78" r="32" fill="#E8E0C8"/>
    <circle cx="512" cy="72" r="28" fill="#C8C0A8" opacity="0.35"/>

    <!-- Stars -->
    <circle cx="45" cy="35" r="1.4" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="95" cy="22" r="1.1" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="155" cy="48" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="210" cy="18" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="275" cy="40" r="1.3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="340" cy="25" r="1.0" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="395" cy="52" r="1.4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="580" cy="30" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="620" cy="55" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="70" cy="85" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="130" cy="72" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="230" cy="95" r="1.0" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="310" cy="68" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="420" cy="88" r="1.1" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="560" cy="95" r="1.0" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="180" cy="115" r="0.9" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="360" cy="105" r="1.0" fill="#FFFFFF" opacity="0.65"/>

    <!-- Distant tree line -->
    <polygon points="0,330 40,300 80,318 120,292 160,310 200,285 240,305 280,278 320,298 360,272 400,290 440,268 480,288 520,265 560,282 600,270 640,295 640,360 0,360" fill="#0A1812"/>
    <polygon points="0,345 50,322 100,340 150,318 200,335 250,312 300,328 350,308 400,325 450,302 500,318 550,298 600,312 640,325 640,360 0,360" fill="#081410"/>

    <!-- Mid-layer pines -->
    <polygon points="70,360 95,290 120,360" fill="#060E0A"/>
    <polygon points="130,360 158,275 186,360" fill="#07120C"/>
    <polygon points="195,360 220,300 245,360" fill="#060E0A"/>
    <polygon points="255,360 285,265 315,360" fill="#07120C"/>
    <polygon points="325,360 350,295 375,360" fill="#060E0A"/>
    <polygon points="385,360 412,270 439,360" fill="#07120C"/>
    <polygon points="445,360 470,305 495,360" fill="#060E0A"/>
    <polygon points="505,360 535,280 565,360" fill="#07120C"/>
    <polygon points="575,360 600,298 625,360" fill="#060E0A"/>

    <!-- Forest floor -->
    <rect x="0" y="360" width="640" height="120" fill="#040806"/>
    <rect x="0" y="360" width="640" height="14" fill="#0A100C"/>

    <!-- Foreground left pine -->
    <rect x="18" y="300" width="16" height="180" fill="#030504"/>
    <polygon points="0,480 26,250 52,480" fill="#050806"/>
    <polygon points="8,480 34,210 60,480" fill="#030504"/>

    <!-- Foreground right pine -->
    <rect x="606" y="295" width="16" height="185" fill="#030504"/>
    <polygon points="588,480 614,245 640,480" fill="#050806"/>
    <polygon points="580,480 606,205 632,480" fill="#030504"/>

    <!-- Foreground shrubs (edges only) -->
    <ellipse cx="95" cy="430" rx="38" ry="18" fill="#060A08"/>
    <ellipse cx="545" cy="435" rx="42" ry="20" fill="#060A08"/>
    <ellipse cx="140" cy="455" rx="28" ry="12" fill="#050806"/>
    <ellipse cx="500" cy="458" rx="32" ry="14" fill="#050806"/>

    <!-- Fireflies (mid-layer, away from center bottom) -->
    <circle cx="165" cy="335" r="2" fill="#B8D850" opacity="0.7"/>
    <circle cx="245" cy="320" r="1.8" fill="#C8E868" opacity="0.6"/>
    <circle cx="470" cy="325" r="2" fill="#B8D850" opacity="0.65"/>
    <circle cx="555" cy="310" r="1.6" fill="#C8E868" opacity="0.55"/>
</svg>
