<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
    <!-- Evening sky -->
    <rect x="0" y="0" width="640" height="160" fill="#0E1428"/>
    <rect x="0" y="120" width="640" height="90" fill="#1E2448"/>
    <rect x="0" y="180" width="640" height="70" fill="#3A2F58"/>
    <rect x="0" y="230" width="640" height="50" fill="#5C3D4A"/>
    <rect x="0" y="260" width="640" height="40" fill="#8B4E3A"/>
    <rect x="0" y="285" width="640" height="35" fill="#C9744A"/>
    <rect x="0" y="305" width="640" height="25" fill="#E8A05A"/>

    <!-- Moon -->
    <circle cx="520" cy="72" r="28" fill="#F2E8C8"/>
    <circle cx="532" cy="66" r="24" fill="#0E1428"/>

    <!-- Stars -->
    <circle cx="80" cy="42" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="145" cy="28" r="1.2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="210" cy="55" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="290" cy="35" r="1.1" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="360" cy="48" r="1.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="430" cy="22" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="580" cy="38" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="620" cy="58" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="55" cy="95" r="1.1" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="175" cy="88" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="250" cy="105" r="1.0" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="400" cy="92" r="1.2" fill="#FFFFFF" opacity="0.85"/>

    <!-- Distant tree line -->
    <polygon points="0,330 40,300 80,318 120,292 160,310 200,285 240,305 280,278 320,298 360,272 400,290 440,268 480,288 520,265 560,282 600,270 640,295 640,360 0,360" fill="#1A3528"/>
    <polygon points="0,345 50,322 100,340 150,318 200,335 250,312 300,328 350,308 400,325 450,302 500,318 550,298 600,312 640,325 640,360 0,360" fill="#142820"/>

    <!-- Mid-layer pines -->
    <polygon points="70,360 95,290 120,360" fill="#0F2018"/>
    <polygon points="130,360 158,275 186,360" fill="#122418"/>
    <polygon points="195,360 220,300 245,360" fill="#0F2018"/>
    <polygon points="255,360 285,265 315,360" fill="#122418"/>
    <polygon points="325,360 350,295 375,360" fill="#0F2018"/>
    <polygon points="385,360 412,270 439,360" fill="#122418"/>
    <polygon points="445,360 470,305 495,360" fill="#0F2018"/>
    <polygon points="505,360 535,280 565,360" fill="#122418"/>
    <polygon points="575,360 600,298 625,360" fill="#0F2018"/>

    <!-- Forest floor -->
    <rect x="0" y="360" width="640" height="120" fill="#0A120E"/>
    <rect x="0" y="360" width="640" height="18" fill="#142018"/>

    <!-- Foreground left pine -->
    <rect x="18" y="300" width="16" height="180" fill="#060A08"/>
    <polygon points="0,480 26,250 52,480" fill="#080F0A"/>
    <polygon points="8,480 34,210 60,480" fill="#060A08"/>

    <!-- Foreground right pine -->
    <rect x="606" y="295" width="16" height="185" fill="#060A08"/>
    <polygon points="588,480 614,245 640,480" fill="#080F0A"/>
    <polygon points="580,480 606,205 632,480" fill="#060A08"/>

    <!-- Foreground shrubs -->
    <ellipse cx="95" cy="430" rx="38" ry="18" fill="#0A140E"/>
    <ellipse cx="545" cy="435" rx="42" ry="20" fill="#0A140E"/>
    <ellipse cx="140" cy="455" rx="28" ry="12" fill="#08100A"/>
    <ellipse cx="500" cy="458" rx="32" ry="14" fill="#08100A"/>

    <!-- Fireflies -->
    <circle cx="180" cy="340" r="2" fill="#D4F070" opacity="0.85"/>
    <circle cx="260" cy="325" r="1.8" fill="#E8F888" opacity="0.75"/>
    <circle cx="380" cy="335" r="2" fill="#D4F070" opacity="0.8"/>
    <circle cx="460" cy="318" r="1.6" fill="#E8F888" opacity="0.7"/>
    <circle cx="310" cy="370" r="1.5" fill="#C8E860" opacity="0.65"/>
    <circle cx="420" cy="365" r="1.7" fill="#D4F070" opacity="0.75"/>
</svg>
