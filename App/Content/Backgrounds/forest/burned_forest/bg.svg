<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
    <!-- Smoky sky -->
    <rect x="0" y="0" width="640" height="200" fill="#585860"/>
    <rect x="0" y="170" width="640" height="110" fill="#686068"/>
    <rect x="0" y="260" width="640" height="100" fill="#787070"/>

    <!-- Distant smoke haze -->
    <rect x="0" y="240" width="640" height="80" fill="#908880" opacity="0.4"/>

    <!-- Distant charred treeline -->
    <polygon points="0,330 45,300 90,318 135,290 180,308 225,282 270,300 315,275 360,292 405,268 450,285 495,270 540,288 585,272 640,295 640,360 0,360" fill="#302828"/>
    <polygon points="0,345 55,318 110,335 165,312 220,330 275,305 330,322 385,300 440,318 495,298 550,312 605,295 640,310 640,360 0,360" fill="#282020"/>

    <!-- Dead standing trunks (mid layer) -->
    <rect x="78" y="285" width="8" height="75" fill="#1A1410"/>
    <rect x="148" y="275" width="7" height="85" fill="#201810"/>
    <rect x="218" y="290" width="8" height="70" fill="#1A1410"/>
    <rect x="288" y="268" width="7" height="92" fill="#181410"/>
    <rect x="358" y="282" width="8" height="78" fill="#1A1410"/>
    <rect x="428" y="272" width="7" height="88" fill="#201810"/>
    <rect x="498" y="288" width="8" height="72" fill="#1A1410"/>
    <rect x="568" y="278" width="7" height="82" fill="#181410"/>

    <!-- Bare branches (mid) -->
    <line x1="82" y1="300" x2="105" y2="285" stroke="#282018" stroke-width="2"/>
    <line x1="82" y1="310" x2="68" y2="298" stroke="#282018" stroke-width="2"/>
    <line x1="152" y1="288" x2="172" y2="270" stroke="#282018" stroke-width="2"/>
    <line x1="292" y1="280" x2="318" y2="262" stroke="#282018" stroke-width="2"/>
    <line x1="292" y1="295" x2="272" y2="282" stroke="#282018" stroke-width="2"/>
    <line x1="432" y1="285" x2="455" y2="268" stroke="#282018" stroke-width="2"/>
    <line x1="572" y1="290" x2="595" y2="275" stroke="#282018" stroke-width="2"/>

    <!-- Ash ground -->
    <rect x="0" y="360" width="640" height="120" fill="#3A3430"/>
    <rect x="0" y="360" width="640" height="16" fill="#444038"/>

    <!-- Foreground dead trees (edges) -->
    <rect x="14" y="260" width="18" height="220" fill="#100C08"/>
    <line x1="23" y1="280" x2="55" y2="240" stroke="#201810" stroke-width="3"/>
    <line x1="23" y1="310" x2="0" y2="290" stroke="#201810" stroke-width="3"/>
    <line x1="23" y1="340" x2="50" y2="320" stroke="#201810" stroke-width="2.5"/>
    <rect x="608" y="255" width="18" height="225" fill="#100C08"/>
    <line x1="617" y1="275" x2="640" y2="248" stroke="#201810" stroke-width="3"/>
    <line x1="617" y1="305" x2="590" y2="285" stroke="#201810" stroke-width="3"/>
    <line x1="617" y1="335" x2="640" y2="318" stroke="#201810" stroke-width="2.5"/>

    <!-- Charred stumps (edges only) -->
    <ellipse cx="98" cy="448" rx="28" ry="12" fill="#2A2420"/>
    <ellipse cx="542" cy="452" rx="32" ry="14" fill="#2A2420"/>

    <!-- Distant ember glow (horizon, not center) -->
    <rect x="0" y="305" width="640" height="20" fill="#884830" opacity="0.25"/>
    <circle cx="580" cy="318" r="6" fill="#C86030" opacity="0.45"/>
    <circle cx="555" cy="325" r="4" fill="#E87840" opacity="0.35"/>
</svg>
