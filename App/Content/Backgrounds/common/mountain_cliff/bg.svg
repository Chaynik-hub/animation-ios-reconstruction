  <path d="M420 448 L458 408 L498 438" fill="none" stroke="#32302E" stroke-width="2" opacity="0.65"/>
  <path d="M300 472 L338 435 L376 458" fill="none" stroke="#383634" stroke-width="1.5" opacity="0.55"/>
