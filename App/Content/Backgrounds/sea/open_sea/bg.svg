<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- Open sea: sky, clouds, waves, gulls (solid fills / strokes only) -->

  <!-- Sky (banded, brighter toward horizon) -->
  <rect x="0" y="0" width="640" height="110" fill="#6CB3E8"/>
  <rect x="0" y="110" width="640" height="95" fill="#7EBEEA"/>
  <rect x="0" y="205" width="640" height="15" fill="#9AD0F2"/>

  <!-- Sun -->
  <circle cx="528" cy="72" r="38" fill="#FFE082"/>
  <circle cx="528" cy="72" r="26" fill="#FFCA28"/>

  <!-- Distant clouds (back) -->
  <ellipse cx="118" cy="64" rx="34" ry="14" fill="#F5F9FC" opacity="0.92"/>
  <ellipse cx="152" cy="66" rx="22" ry="11" fill="#F5F9FC" opacity="0.92"/>
  <ellipse cx="92" cy="70" rx="20" ry="10" fill="#E8F2FA" opacity="0.88"/>
  <ellipse cx="302" cy="48" rx="40" ry="15" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="338" cy="50" rx="28" ry="12" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="268" cy="54" rx="24" ry="11" fill="#EAF4FB" opacity="0.9"/>

  <!-- Mid clouds -->
  <ellipse cx="455" cy="88" rx="32" ry="13" fill="#FFFFFF" opacity="0.94"/>
  <ellipse cx="485" cy="90" rx="24" ry="11" fill="#FFFFFF" opacity="0.94"/>
  <ellipse cx="430" cy="92" rx="18" ry="9" fill="#F0F6FC" opacity="0.88"/>

  <!-- Sea body -->
  <rect x="0" y="220" width="640" height="260" fill="#166A9E"/>

  <!-- Sea stripes (light on water) -->
  <path d="M0 248 C80 238 160 258 240 248 S400 238 480 248 S560 258 640 248 L640 292 L0 292 Z" fill="#1B7CB3"/>
  <path d="M0 300 C100 288 200 312 300 300 S500 288 600 300 S620 304 640 300 L640 348 L0 348 Z" fill="#156497"/>
  <path d="M0 360 C120 348 240 372 360 360 S520 348 640 360 L640 480 L0 480 Z" fill="#0F5585"/>

  <!-- Wave crest foam (near horizon) -->
  <path d="M0 228 C64 222 128 234 192 228 S320 222 384 228 S448 234 512 228 S576 222 640 228 L640 242 L0 242 Z" fill="#B8DDF5" opacity="0.85"/>
  <path d="M0 236 C96 228 192 244 288 236 S480 228 576 236 S608 240 640 236 L640 250 L0 250 Z" fill="#E3F2FC" opacity="0.65"/>

  <!-- Rolling wave lines -->
  <path d="M0 268 Q40 262 80 268 T160 268 T240 268 T320 268 T400 268 T480 268 T560 268 T640 268" fill="none" stroke="#E1F5FE" stroke-width="3" opacity="0.7"/>
  <path d="M0 318 Q40 310 80 318 T160 318 T240 318 T320 318 T400 318 T480 318 T560 318 T640 318" fill="none" stroke="#B3E5FC" stroke-width="2.5" opacity="0.55"/>
  <path d="M0 398 Q48 388 96 398 T192 398 T288 398 T384 398 T480 398 T576 398 T640 398" fill="none" stroke="#81D4FA" stroke-width="2" opacity="0.4"/>

  <!-- Foreground cloud puff -->
  <ellipse cx="58" cy="118" rx="26" ry="11" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="78" cy="120" rx="16" ry="8" fill="#FFFFFF" opacity="0.9"/>

  <!-- Seagulls (stroked chevrons; smaller/y higher reads as farther) -->
  <path d="M142 58 L152 64 L162 58" fill="none" stroke="#263238" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M168 52 L176 57 L184 52" fill="none" stroke="#37474F" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M388 104 L396 109 L404 104" fill="none" stroke="#263238" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M416 96 L424 101 L432 96" fill="none" stroke="#37474F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M332 72 L340 77 L348 72" fill="none" stroke="#455A64" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 42 L98 46 L104 42" fill="none" stroke="#455A64" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M610 118 L618 123 L626 118" fill="none" stroke="#263238" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
