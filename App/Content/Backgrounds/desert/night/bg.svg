<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- sky -->
  <rect width="640" height="480" fill="#0B1E4A"/>

  <!-- crescent moon (overlap, no mask) -->
  <circle cx="520" cy="70" r="32" fill="#FFF8B5"/>
  <circle cx="536" cy="58" r="26" fill="#0B1E4A"/>

  <!-- far mountains -->
  <polygon fill="#2D4A77" points="0,290 70,240 140,275 220,210 300,265 380,225 460,270 540,235 640,260 640,320 0,320"/>

  <!-- sand -->
  <rect x="0" y="300" width="640" height="180" fill="#5A4A38"/>

  <!-- cactus left (framing) -->
  <rect x="48" y="220" width="28" height="120" fill="#2A5232"/>
  <rect x="28" y="250" width="20" height="18" fill="#2A5232"/>
  <rect x="28" y="210" width="18" height="58" fill="#2A5232"/>
  <rect x="76" y="265" width="22" height="16" fill="#2A5232"/>
  <rect x="80" y="230" width="18" height="51" fill="#2A5232"/>

  <!-- cactus right (framing) -->
  <rect x="560" y="250" width="22" height="90" fill="#2A5232"/>
  <rect x="542" y="270" width="18" height="14" fill="#2A5232"/>
  <rect x="542" y="240" width="16" height="44" fill="#2A5232"/>
</svg>
