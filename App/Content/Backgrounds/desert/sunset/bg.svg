<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- upper dusk -->
  <rect width="640" height="480" fill="#4A2F5C"/>

  <!-- sunset band (solid, no gradient) -->
  <rect x="0" y="140" width="640" height="200" fill="#D4633A"/>

  <!-- sun low -->
  <circle cx="500" cy="230" r="40" fill="#FFF0A0"/>

  <!-- far mountains -->
  <polygon fill="#8B5560" points="0,290 70,240 140,275 220,210 300,265 380,225 460,270 540,235 640,260 640,320 0,320"/>

  <!-- sand -->
  <rect x="0" y="300" width="640" height="180" fill="#8B5A3C"/>

  <!-- cactus left (framing) -->
  <rect x="48" y="220" width="28" height="120" fill="#2F4A34"/>
  <rect x="28" y="250" width="20" height="18" fill="#2F4A34"/>
  <rect x="28" y="210" width="18" height="58" fill="#2F4A34"/>
  <rect x="76" y="265" width="22" height="16" fill="#2F4A34"/>
  <rect x="80" y="230" width="18" height="51" fill="#2F4A34"/>

  <!-- cactus right (framing) -->
  <rect x="560" y="250" width="22" height="90" fill="#2F4A34"/>
  <rect x="542" y="270" width="18" height="14" fill="#2F4A34"/>
  <rect x="542" y="240" width="16" height="44" fill="#2F4A34"/>
</svg>
