    <rect x="18" y="255" width="12" height="95" fill="#8B5A3C"/>
    <ellipse cx="24" cy="248" rx="38" ry="10" fill="#45B86A"/>
    <ellipse cx="24" cy="260" rx="32" ry="9" fill="#3FAA60"/>
    <rect x="610" y="255" width="12" height="95" fill="#8B5A3C"/>
    <ellipse cx="616" cy="248" rx="38" ry="10" fill="#45B86A"/>
    <ellipse cx="616" cy="260" rx="32" ry="9" fill="#3FAA60"/>
