  <circle cx="556" cy="60" r="28" fill="#0B1E4A"/>

  <!-- far ridge -->
  <polygon fill="#2D4A77" points="0,300 90,200 170,270 280,140 380,250 470,180 560,240 640,210 640,360 0,360"/>

  <!-- near ridge -->
